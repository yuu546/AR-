<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173b32">
<title>千貫石 ARガイド</title>
<style>
:root{--green:#173b32;--mint:#dff3e8;--glass:rgba(255,255,255,.91);--shadow:0 8px 28px #10251f45}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#101b18;color:#fff;overflow:hidden}
#camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#31483f}
#fallback{position:fixed;inset:0;background:linear-gradient(#8bb6d8 0 38%,#526f62 38% 55%,#334b39 55%);background-size:cover;background-position:center;z-index:-1}
#shade{position:fixed;inset:0;background:linear-gradient(180deg,#071d284f,transparent 30%,#071d2866);pointer-events:none}
header{position:absolute;top:env(safe-area-inset-top,12px);left:14px;right:14px;display:flex;justify-content:space-between;gap:8px;align-items:center;z-index:5}
.pill{background:#173b32d9;border:1px solid #ffffff55;border-radius:30px;padding:10px 14px;backdrop-filter:blur(12px);font-weight:700;box-shadow:var(--shadow)}
#status{font-size:12px;font-weight:500}
#targetLayer{position:absolute;inset:85px 0 170px;overflow:hidden;pointer-events:none}
.marker{position:absolute;transform:translate(-50%,-50%);width:min(190px,45vw);color:#15231f;background:var(--glass);border:1px solid #ffffffb0;border-radius:15px;padding:10px 11px;box-shadow:var(--shadow);pointer-events:auto;cursor:pointer;backdrop-filter:blur(10px)}
.marker .name{font-weight:800;font-size:14px;line-height:1.3}.marker .meta{font-size:11px;color:#465650;margin-top:4px}.pin{position:absolute;left:50%;bottom:-22px;transform:translateX(-50%);width:20px;height:20px;border:4px solid white;border-radius:50% 50% 50% 0;background:#1686e8;rotate:-45deg;box-shadow:0 2px 12px #0008}
.marker .distance{font-weight:700;color:#276749}
#bottom{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));left:14px;right:14px;z-index:6;display:grid;gap:10px}
#filters{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}
.filter{border:1px solid #ffffff88;background:#172d29dd;color:white;border-radius:22px;padding:9px 13px;font-size:12px}
.filter.active{background:#e8fff1;color:#173b32;font-weight:800}
#panel{background:var(--glass);color:#1b2b25;border-radius:18px;padding:13px 15px;box-shadow:var(--shadow);display:none;backdrop-filter:blur(12px);max-height:35vh;overflow:auto}
#panel h2{font-size:17px;margin:0 0 5px}#panel p{font-size:13px;margin:5px 0;line-height:1.55}#panel .muted{color:#53645c;font-size:11px}
button{font:inherit;cursor:pointer}#actions{display:flex;justify-content:center;gap:8px}
.action{border:0;border-radius:25px;padding:11px 15px;background:#173b32e8;color:#fff;font-weight:700;box-shadow:var(--shadow)}
#start{background:#e8fff1;color:#173b32}
#mapMini{position:absolute;bottom:calc(120px + env(safe-area-inset-bottom));left:14px;width:104px;height:104px;border-radius:50%;border:1px solid #ffffffa8;background:#173b32b8;backdrop-filter:blur(8px);z-index:4;display:grid;place-items:center;font-size:11px;text-align:center}
#notice{position:absolute;top:75px;left:50%;transform:translateX(-50%);width:max-content;max-width:90%;background:#142b26d9;border-radius:12px;padding:8px 12px;font-size:11px;text-align:center;z-index:7}
#close{float:right;border:0;background:#e8eee9;border-radius:20px;padding:4px 9px}
#sample{font-size:10px;color:#f9f5db;text-align:center;text-shadow:0 1px 3px #000}
@media(min-width:700px){#targetLayer{inset:100px 5vw 180px}.marker{width:210px}.marker .name{font-size:16px}#bottom{left:50%;transform:translateX(-50%);width:min(720px,90vw)}}
</style>
</head>
<body>
<div id="fallback"></div>
<video id="camera" autoplay playsinline muted></video><div id="shade"></div>
<header>
 <div class="pill">📍 千貫石ため池周辺</div>
 <div class="pill" id="status">AR準備中</div>
</header>
<div id="notice">「カメラを起動」と「位置情報を取得」を押して始めよう</div>
<div id="targetLayer"></div>
<div id="mapMini">🧭<br>周辺スポット<br><span id="count">3件</span></div>
<div id="bottom">
 <div id="panel"><button id="close">閉じる</button><h2 id="detailName"></h2><p id="detailText"></p><p class="muted" id="detailMeta"></p></div>
 <div id="filters">
  <button class="filter active" data-cat="all">すべて</button>
  <button class="filter" data-cat="view">🏞 観光</button>
  <button class="filter" data-cat="food">🍜 グルメ</button>
  <button class="filter" data-cat="shop">🛍 お店</button>
 </div>
 <div id="actions">
  <button class="action" id="start">📷 カメラを起動</button>
  <button class="action" id="locate">📍 位置情報</button>
  <button class="action" id="compass">🧭 方角を有効化</button>
 </div>
 <div id="sample">※表示スポットは動作確認用のサンプルです。実在店舗・口コミ情報ではありません。</div>
</div>
<script>
// 千貫石ため池付近を仮の中心点にしたデモデータ。
// 実際の店舗・観光施設・口コミに置き換えてから公開してください。
const origin={lat:39.225535,lon:141.00898365};
const spots=[
 {id:1,name:"千貫石ため池",cat:"view",lat:39.225535,lon:141.008984,rating:"—",text:"自然の景色を楽しめるスポット。ここに写真や観光案内を追加できます。"},
 {id:2,name:"展望スポット（サンプル）",cat:"view",lat:39.2282,lon:141.0120,rating:"4.8",text:"周辺の景色を楽しむ場所のサンプル表示です。正確な位置・説明に差し替えてください。"},
 {id:3,name:"地元のお店（サンプル）",cat:"food",lat:39.2228,lon:141.0055,rating:"4.3",text:"お店の紹介文、営業時間、連絡先、口コミなどを登録する欄です。"}
];
let userPos=null,heading=0,headingReady=false,activeCat="all";
const video=document.getElementById("camera"),layer=document.getElementById("targetLayer");
const statusEl=document.getElementById("status"),notice=document.getElementById("notice");
function distance(a,b){const R=6371000,rad=x=>x*Math.PI/180;let dLat=rad(b.lat-a.lat),dLon=rad(b.lon-a.lon),x=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function bearing(a,b){const r=x=>x*Math.PI/180, d=r(b.lon-a.lon), y=Math.sin(d)*Math.cos(r(b.lat)),x=Math.cos(r(a.lat))*Math.sin(r(b.lat))-Math.sin(r(a.lat))*Math.cos(r(b.lat))*Math.cos(d);return (Math.atan2(y,x)*180/Math.PI+360)%360}
function render(){
 layer.innerHTML="";
 const visible=spots.filter(s=>activeCat==="all"||s.cat===activeCat);
 document.getElementById("count").textContent=visible.length+"件";
 visible.forEach((s,i)=>{
  let dist=userPos?distance(userPos,s):distance(origin,s), bear=userPos?bearing(userPos,s):bearing(origin,s);
  let relative=((bear-heading+540)%360)-180;
  // 方角が使えない場合はカードを並べて表示
  let x=headingReady?50+relative/1.5:22+(i%3)*28;
  if(headingReady && Math.abs(relative)>75)return;
  x=Math.max(12,Math.min(88,x));
  let y=35+(i%2)*28;
  let el=document.createElement("button");el.className="marker";el.style.left=x+"%";el.style.top=y+"%";
  el.innerHTML=`<div class="name">${s.name}</div><div class="meta">⭐ ${s.rating}　<span class="distance">${Math.round(dist)} m</span></div><div class="meta">${s.text.slice(0,36)}${s.text.length>36?"…":""}</div><span class="pin"></span>`;
  el.addEventListener("click",()=>showDetail(s,dist));layer.appendChild(el);
 });
}
function showDetail(s,dist){document.getElementById("detailName").textContent=s.name;document.getElementById("detailText").textContent=s.text;document.getElementById("detailMeta").textContent=`距離の目安：約${Math.round(dist)}m ／ カテゴリー：${s.cat} ／ 評価：${s.rating}`;document.getElementById("panel").style.display="block"}
document.getElementById("close").onclick=()=>document.getElementById("panel").style.display="none";
document.getElementById("start").onclick=async()=>{
 try{let stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});video.srcObject=stream;notice.textContent="カメラ起動中。周囲に気をつけて利用してください。";statusEl.textContent="● カメラ起動中";document.getElementById("fallback").style.display="none"}
 catch(e){notice.textContent="カメラを起動できません。HTTPS接続とブラウザのカメラ許可を確認してください。"}
};
document.getElementById("locate").onclick=()=>{
 if(!navigator.geolocation){notice.textContent="このブラウザでは位置情報を利用できません";return}
 navigator.geolocation.getCurrentPosition(p=>{userPos={lat:p.coords.latitude,lon:p.coords.longitude};statusEl.textContent="● 現在地取得済み";notice.textContent="現在地を取得しました。周辺スポットを表示しています。";render()},e=>{notice.textContent="位置情報を取得できません。ブラウザの許可設定を確認してください。"},{enableHighAccuracy:true,timeout:15000});
};
document.getElementById("compass").onclick=async()=>{
 try{
  if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"){
   const result=await DeviceOrientationEvent.requestPermission();if(result!=="granted")throw new Error("permission");
  }
  window.addEventListener("deviceorientationabsolute",e=>{if(e.alpha!==null){heading=(360-e.alpha)%360;headingReady=true;render()}},{once:false});
  window.addEventListener("deviceorientation",e=>{if(e.webkitCompassHeading!==undefined){heading=e.webkitCompassHeading;headingReady=true;render()}},{once:false});
  notice.textContent="方角センサーを有効化しました。端末をゆっくり動かしてください。";
 }catch(e){notice.textContent="方角を利用できません。端末・ブラウザの対応状況を確認してください。"}
};
document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");activeCat=b.dataset.cat;render()});
render();
if(location.protocol!=="https:")notice.textContent="カメラ・位置情報にはHTTPS接続が必要です。GitHub Pagesなどに公開して利用してください。";
</script>
</body></html>
